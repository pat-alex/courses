<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البرنامج التدريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell" id="appShell" style="display:none;">

  <main class="main-pane">
    <div class="topbar">
      <div>
        <span class="trainee-name" id="traineeNameLabel"></span>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <a href="#" class="logout-link" id="logoutLink">تسجيل الخروج</a>
    </div>

    <div id="viewer">
      <!-- محتوى الموضوع أو الاختبار بيتحط هنا بالجافاسكريبت -->
    </div>
  </main>

  <aside class="sidebar">
    <div class="course-title" id="sidebarCourseTitle"></div>
    <div class="academy-line" id="sidebarAcademyName"></div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0% مكتمل</div>

    <div id="unitsList"></div>
  </aside>

</div>

<div class="loading-state" id="loadingState">جاري تحميل البرنامج...</div>
<div class="error-state" id="errorState" style="display:none;"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
